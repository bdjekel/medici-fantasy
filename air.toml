# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  # Build the API server from cmd/api
  cmd = "go build -o ./tmp/medici-fantasy ./cmd/api"
  bin = "tmp/medici-fantasy"
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
  exclude_dir = ["assets", "tmp", "vendor", ".git", "docs", "migrations", "fetcher", "scripts"]
  exclude_file = ["go.sum"]
  delay = 1000
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"      
  watcher = "cyan"

[log]
  color = true
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[events]
  # on_save = "bash ./scripts/generate-env-example.sh"
  include = [".env"]